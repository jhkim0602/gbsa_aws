[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
version_path_separator = os
recursive_version_locations = true
version_locations =
    %(here)s/alembic/versions/company
    %(here)s/alembic/versions/submission
    %(here)s/alembic/versions/interview
    %(here)s/alembic/versions/reporting
    %(here)s/alembic/versions/merge
sqlalchemy.url = sqlite+pysqlite:///:memory:

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

