            $ref: '#/components/schemas/HumanReviewView'
    QuestionRationaleView:
      type: object
      additionalProperties: false
      required:
      - criterion_id
      - verification_target_type
      - objective
      - question_type
      - retrieval_version
      - generation_version
      - policy_result
      - source_references
      properties:
        criterion_id:
          type: string
          format: uuid
        verification_target_type:
          type: string
          enum:
          - not_mentioned
          - claim_found
          - detail_missing
          - source_conflict
          - ownership_uncertain
        objective:
          type: string
          minLength: 1
          maxLength: 4000
        question_type:
          type: string
          enum:
          - common
          - personalized
          - follow_up
          - degraded
        retrieval_version:
          type: string
          minLength: 1
          maxLength: 200
        generation_version:
          type: string
          minLength: 1
          maxLength: 200
        policy_result:
          type: string
          minLength: 1
          maxLength: 200
        source_references:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - source_id
            - source_type
            - locator
            - excerpt
            properties:
              source_id:
                type: string
                format: uuid
              source_type:
                type: string
              locator:
                type: object
              excerpt:
                type: string
                maxLength: 2000
    TimelineView:
      type: object
      additionalProperties: false
      required:
      - entries
      - playback
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - entry_id
            - entry_type
            - start_ms
            - end_ms
            properties:
              entry_id:
                type: string
                format: uuid
              entry_type:
                type: string
                enum:
                - question
                - answer
                - event
                - evidence
              start_ms:
                type: integer
                minimum: 0
              end_ms:
                type: integer
                minimum: 0
              text:
                type:
                - string
                - 'null'
