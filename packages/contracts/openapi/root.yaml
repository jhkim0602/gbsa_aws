openapi: 3.1.0
info:
  title: Interview Evidence Platform API
  version: 1.0.0
  description: 'Contract baseline for the Korean-language pilot. All company routes
    enforce the company_id

    from the authenticated principal. Applicant routes enforce the invitation-scoped
    session

    cookie; neither API accepts company_id from an untrusted request body.

    '
servers:
- url: /v1
tags:
- name: Company
- name: Hiring
- name: Applicant Access
- name: Submission
- name: Interview
- name: Reporting
- name: Privacy
paths:
  /me:
    $ref: ./paths/company/paths.yaml#/~1me
  /positions:
    $ref: ./paths/company/paths.yaml#/~1positions
  /positions/{position_id}:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}
  /interviewer-profiles:
    $ref: ./paths/company/paths.yaml#/~1interviewer-profiles
  /positions/{position_id}/competency-model-versions:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1competency-model-versions
  /competency-model-versions/{version_id}/publish:
    $ref: ./paths/company/paths.yaml#/~1competency-model-versions~1{version_id}~1publish
  /positions/{position_id}/invitations:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1invitations
  /applicant/access/exchange:
    $ref: ./paths/company/paths.yaml#/~1applicant~1access~1exchange
  /applicant/access/revoke:
    $ref: ./paths/company/paths.yaml#/~1applicant~1access~1revoke
  /applicant/identity-verifications:
    $ref: ./paths/company/paths.yaml#/~1applicant~1identity-verifications
  /applicant/consents:
    $ref: ./paths/company/paths.yaml#/~1applicant~1consents
  /applicant/submissions/upload-intents:
    $ref: ./paths/submission/paths.yaml#/~1applicant~1submissions~1upload-intents
  /applicant/submissions:
    $ref: ./paths/submission/paths.yaml#/~1applicant~1submissions
  /applicant/analysis-status:
    $ref: ./paths/submission/paths.yaml#/~1applicant~1analysis-status
  /applicant/equipment-checks:
    $ref: ./paths/interview/paths.yaml#/~1applicant~1equipment-checks
  /applicant/interview-sessions:
    $ref: ./paths/interview/paths.yaml#/~1applicant~1interview-sessions
  /applicant/interview-sessions/{session_id}/resume:
    $ref: ./paths/interview/paths.yaml#/~1applicant~1interview-sessions~1{session_id}~1resume
  /applicant/interview-sessions/{session_id}/media-upload-intents:
    $ref: ./paths/interview/paths.yaml#/~1applicant~1interview-sessions~1{session_id}~1media-upload-intents
  /interview-sessions/{session_id}/report:
    $ref: ./paths/reporting/paths.yaml#/~1interview-sessions~1{session_id}~1report
  /interview-sessions/{session_id}/timeline:
    $ref: ./paths/reporting/paths.yaml#/~1interview-sessions~1{session_id}~1timeline
  /reports/{report_id}/items/{report_item_id}/reviews:
    $ref: ./paths/reporting/paths.yaml#/~1reports~1{report_id}~1items~1{report_item_id}~1reviews
  /interview-sessions/{session_id}/review-artifacts:
    $ref: ./paths/reporting/paths.yaml#/~1interview-sessions~1{session_id}~1review-artifacts
  /invitations/{invitation_id}/final-decisions:
    $ref: ./paths/reporting/paths.yaml#/~1invitations~1{invitation_id}~1final-decisions
  /privacy/deletion-requests:
    $ref: ./paths/reporting/paths.yaml#/~1privacy~1deletion-requests
  /privacy/deletion-requests/{deletion_request_id}:
    $ref: ./paths/reporting/paths.yaml#/~1privacy~1deletion-requests~1{deletion_request_id}
components:
  securitySchemes:
    CompanyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApplicantSession:
      type: apiKey
      in: cookie
      name: iep_applicant_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PositionId:
      name: position_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportItemId:
      name: report_item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Structured error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      - retryable
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        current_version:
          type: integer
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            properties:
              field:
                type: string
              code:
                type: string
    CompanyUserView:
      type: object
      additionalProperties: false
      required:
      - company_user_id
      - company_id
      - email
      - status
      properties:
        company_user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - invited
          - active
          - disabled
    PositionCreate:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
        role_type:
          type:
          - string
          - 'null'
          maxLength: 100
        headcount:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
        recruitment_start_at:
          type:
          - string
          - 'null'
          format: date
        recruitment_end_at:
          type:
          - string
          - 'null'
          format: date
    PositionUpdate:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      - status
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
        role_type:
          type:
          - string
          - 'null'
          maxLength: 100
        headcount:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
        recruitment_start_at:
          type:
          - string
          - 'null'
          format: date
        recruitment_end_at:
          type:
          - string
          - 'null'
          format: date
        status:
          type: string
          enum:
          - draft
          - active
          - closed
    Position:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/PositionCreate'
      - type: object
        required:
        - position_id
        - status
        - row_version
        - created_at
        properties:
          position_id:
            type: string
            format: uuid
          status:
            type: string
            enum:
            - draft
            - active
            - closed
          row_version:
            type: integer
            minimum: 1
          created_at:
            type: string
            format: date-time
    PositionPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        next_cursor:
          type:
          - string
          - 'null'
    InterviewerProfileCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - tone
      - voice_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        tone:
          type: string
          enum:
          - calm
          - friendly
          - analytical
          - concise
        voice_id:
          type: string
          minLength: 1
          maxLength: 100
    InterviewerProfile:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/InterviewerProfileCreate'
      - type: object
        required:
        - interviewer_profile_id
        - row_version
        - created_at
        properties:
          interviewer_profile_id:
            type: string
            format: uuid
          row_version:
            type: integer
            minimum: 1
          created_at:
            type: string
            format: date-time
    InterviewerProfilePage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InterviewerProfile'
        next_cursor:
          type:
          - string
          - 'null'
    JobRequirementInput:
      type: object
      additionalProperties: false
      required:
      - requirement_type
      - statement
      - priority
      - criterion_code
      properties:
        requirement_type:
          type: string
          enum:
          - required
          - preferred
        statement:
          type: string
          minLength: 1
          maxLength: 4000
        priority:
          type: integer
          minimum: 1
          maximum: 5
        criterion_code:
          type: string
          pattern: ^[A-Z0-9_-]{2,40}$
    CriterionVerificationGuide:
      type: object
      additionalProperties: false
      required:
      - observable_dimensions
      - strong_answer_signals
      - weak_answer_signals
      - follow_up_directions
      - max_follow_ups
      - time_budget_seconds
      properties:
        observable_dimensions:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 500
        strong_answer_signals:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 1000
        weak_answer_signals:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 1000
        follow_up_directions:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 500
        max_follow_ups:
          type: integer
          minimum: 0
          maximum: 3
        time_budget_seconds:
          type: integer
          minimum: 60
          maximum: 1800
    EvaluationCriterionInput:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - description
      - weight
      - verification_guide
      - abstain_guidance
      - required
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_-]{2,40}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        weight:
          type: number
          minimum: 0
        verification_guide:
          $ref: '#/components/schemas/CriterionVerificationGuide'
        good_evidence:
          type: object
        weak_evidence:
          type: object
        abstain_guidance:
          type: string
          minLength: 1
        common_questions:
          type: array
          items:
            type: string
        required:
          type: boolean
    CompetencyModelVersionCreate:
      type: object
      additionalProperties: false
      required:
      - job_requirements
      - criteria
      - prohibited_topics
      - interview_duration_minutes
      properties:
        job_requirements:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/JobRequirementInput'
        criteria:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/EvaluationCriterionInput'
        prohibited_topics:
          type: array
          items:
            type: string
        interview_duration_minutes:
          type: integer
          minimum: 10
          maximum: 120
        persona_definition:
          type: object
          description: System-managed compatibility field; recruiter clients must
            not set it.
    CompetencyModelVersion:
      type: object
      additionalProperties: false
      required:
      - competency_model_version_id
      - position_id
      - version_number
      - job_requirements
      - criteria
      - prohibited_topics
      - interview_duration_minutes
      - status
      - row_version
      properties:
        competency_model_version_id:
          type: string
          format: uuid
        position_id:
          type: string
          format: uuid
        version_number:
          type: integer
          minimum: 1
        job_requirements:
          type: array
          maxItems: 50
          description: Legacy versions can be empty; new version requests require
            at least one item.
          items:
            $ref: '#/components/schemas/JobRequirementInput'
        criteria:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/EvaluationCriterionInput'
        prohibited_topics:
          type: array
          items:
            type: string
        interview_duration_minutes:
          type: integer
          minimum: 10
          maximum: 120
        persona_definition:
          type: object
          description: System-managed compatibility field.
        status:
          type: string
          enum:
          - draft
          - published
          - retired
        row_version:
          type: integer
          minimum: 1
        published_at:
          type:
          - string
          - 'null'
          format: date-time
    CompetencyModelVersionPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompetencyModelVersion'
        next_cursor:
          type:
          - string
          - 'null'
    InvitationBatchCreate:
      type: object
      additionalProperties: false
      required:
      - applicants
      - expires_at
      properties:
        applicants:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - email
            - display_name
            properties:
              email:
                type: string
                format: email
              display_name:
                type: string
                minLength: 1
                maxLength: 200
        expires_at:
          type: string
          format: date-time
    InvitationView:
      type: object
      additionalProperties: false
      required:
      - invitation_id
      - position_id
      - competency_model_version_id
      - applicant_email
      - status
      - expires_at
      - row_version
      properties:
        invitation_id:
          type: string
          format: uuid
        position_id:
          type: string
          format: uuid
        competency_model_version_id:
          type: string
          format: uuid
        applicant_email:
          type: string
          format: email
        applicant_display_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - invited
          - identity_verified
          - consented
          - materials_submitted
          - analyzing
          - ready
          - interviewing
          - interrupted
          - completed
          - reviewed
          - expired
          - revoked
          - deleted
        expires_at:
          type: string
          format: date-time
        row_version:
          type: integer
          minimum: 1
        analysis_status:
          type:
          - string
          - 'null'
        interview_status:
          type:
          - string
          - 'null'
        report_status:
          type:
          - string
          - 'null'
        interview_session_id:
          type:
          - string
          - 'null'
          format: uuid
    InvitationPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvitationView'
        next_cursor:
          type:
          - string
          - 'null'
    InvitationBatchResult:
      type: object
      additionalProperties: false
      required:
      - accepted_count
      - rejected_count
      - invitations
      properties:
        accepted_count:
          type: integer
          minimum: 0
        rejected_count:
          type: integer
          minimum: 0
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationView'
    ApplicantTokenExchange:
      type: object
      additionalProperties: false
      required:
      - invitation_token
      properties:
        invitation_token:
          type: string
          minLength: 32
          maxLength: 4096
    ApplicantIdentityVerification:
      type: object
      additionalProperties: false
      required:
      - display_name
      - verification_value
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        verification_value:
          type: string
          minLength: 1
          maxLength: 500
    ApplicantAccessState:
      type: object
      additionalProperties: false
      required:
      - invitation_id
      - state
      - expires_at
      - required_actions
      properties:
        invitation_id:
          type: string
          format: uuid
        state:
          type: string
        expires_at:
          type: string
          format: date-time
        required_actions:
          type: array
          items:
            type: string
    ConsentCreate:
      type: object
      additionalProperties: false
      required:
      - policy_version
      - accepted_purposes
      - consent_content_digest
      properties:
        policy_version:
          type: string
        accepted_purposes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - document_analysis
            - recording
            - ai_assessment
        consent_content_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
    ConsentPolicyView:
      type: object
      additionalProperties: false
      required:
      - policy_version
      - ai_role
      - recording_notice
      - processing_purposes
      - retention_days
      - deletion_method
      - required_purposes
      - content_digest
      properties:
        policy_version:
          type: string
          minLength: 1
        ai_role:
          type: string
          minLength: 1
        recording_notice:
          type: string
          minLength: 1
        processing_purposes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - purpose
            - title
            - description
            properties:
              purpose:
                type: string
                enum:
                - document_analysis
                - recording
                - ai_assessment
              title:
                type: string
                minLength: 1
              description:
                type: string
                minLength: 1
        retention_days:
          type: integer
          minimum: 1
        deletion_method:
          type: string
          minLength: 1
        required_purposes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - document_analysis
            - recording
            - ai_assessment
        content_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
    ConsentView:
      type: object
      additionalProperties: false
      required:
      - consent_record_id
      - policy_version
      - accepted_purposes
      - retention_days
      - accepted_at
      properties:
        consent_record_id:
          type: string
          format: uuid
        policy_version:
          type: string
        accepted_purposes:
          type: array
          items:
            type: string
        retention_days:
          type: integer
          minimum: 1
        accepted_at:
          type: string
          format: date-time
    UploadIntentCreate:
      type: object
      additionalProperties: false
      required:
      - source_type
      - filename
      - media_type
      - byte_size
      - sha256
      properties:
        source_type:
          type: string
          enum:
          - cover_letter
          - resume
          - pdf
        filename:
          type: string
          minLength: 1
          maxLength: 255
        media_type:
          type: string
        byte_size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    UploadIntent:
      type: object
      additionalProperties: false
      required:
      - upload_id
      - method
      - url
      - required_headers
      - expires_at
      properties:
        upload_id:
          type: string
          format: uuid
        method:
          type: string
          enum:
          - PUT
        url:
          type: string
          format: uri
        required_headers:
          type: object
        expires_at:
          type: string
          format: date-time
    SubmissionCreate:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - source_type
        - upload_id
        properties:
          source_type:
            type: string
            enum:
            - cover_letter
            - resume
            - pdf
          upload_id:
            type: string
            format: uuid
      - type: object
        additionalProperties: false
        required:
        - source_type
        - public_url
        properties:
          source_type:
            type: string
            enum:
            - public_git
            - public_url
          public_url:
            type: string
            format: uri
          candidate_identity_inputs:
            type: object
    SubmissionView:
      type: object
      additionalProperties: false
      required:
      - submission_id
      - source_type
      - status
      - created_at
      properties:
        submission_id:
          type: string
          format: uuid
        source_type:
          type: string
        status:
          type: string
          enum:
          - received
          - validating
          - analyzing
          - ready
          - partial
          - failed
          - deleted
        failure_code:
          type:
          - string
          - 'null'
        impact_summary:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    AnalysisReadiness:
      type: object
      additionalProperties: false
      required:
      - overall_status
      - submissions
      - interview_ready
      properties:
        overall_status:
          type: string
          enum:
          - waiting
          - analyzing
          - ready
          - partial
          - failed
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionView'
        interview_ready:
          type: boolean
        strategy_id:
          type:
          - string
          - 'null'
          format: uuid
        strategy_version:
          type:
          - integer
          - 'null'
        impact_summary:
          type:
          - string
          - 'null'
    EquipmentCheckCreate:
      type: object
      additionalProperties: false
      required:
      - camera
      - microphone
      - network
      properties:
        camera:
          $ref: '#/components/schemas/EquipmentComponent'
        microphone:
          $ref: '#/components/schemas/EquipmentComponent'
        network:
          $ref: '#/components/schemas/EquipmentComponent'
    EquipmentComponent:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ready
          - warning
          - failed
        sanitized_code:
          type:
          - string
          - 'null'
    EquipmentCheck:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/EquipmentCheckCreate'
      - type: object
        required:
        - equipment_check_id
        - overall_status
        - checked_at
        properties:
          equipment_check_id:
            type: string
            format: uuid
          overall_status:
            type: string
            enum:
            - ready
            - warning
            - failed
          checked_at:
            type: string
            format: date-time
    InterviewSessionCreate:
      type: object
      additionalProperties: false
      required:
      - equipment_check_id
