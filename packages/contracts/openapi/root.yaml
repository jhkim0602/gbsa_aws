    AxisAssessmentView:
      description: One evaluation axis as the model judged it. The score is an AI
        judgement offered to a reviewer as material, never a hiring decision, and
        it is only present when the citations in quoted_evidence_ids resolved to real
        Evidence at generation time.
      type: object
      additionalProperties: false
      required:
      - axis
      - label
      - score
      - rationale
      - quoted_evidence_ids
      properties:
        axis:
          type: string
          maxLength: 40
        label:
          description: Korean label captured when the report was generated, so an
            older report keeps its wording after the axis list changes.
          type: string
          maxLength: 40
        score:
          description: null means the answers gave no basis to judge this axis, or
            that the score was withheld because its citations did not resolve. It
            is never a zero, because zero says the answer was wrong.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
        rationale:
          type: string
        quoted_evidence_ids:
          description: The Evidence this score rests on. Empty exactly when score
            is null.
          type: array
          items:
            type: string
            format: uuid
        weight:
          description: 'What this axis counted for in the criterion score, frozen when
            the

            report was generated. Absent on reports scored before weights existed,
            which

            counted every axis equally.

            '
          type:
          - number
          - 'null'
          minimum: 0
    ScoreContribution:
      description: 'One scored entry''s arithmetic, in the form the reviewer''s calculator
        renders.

        normalized_weight is the share of the whole configuration rather than of what
        survived,

        so the contributions add up to numerator and the shortfall against 1.0 is visible
        as

        denominator.

        '
      type: object
      additionalProperties: false
      required:
      - key
      - score
      - weight
      - normalized_weight
      - contribution
      properties:
        key:
          description: Criterion id at report level, axis key at criterion level.
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        weight:
          type: number
          minimum: 0
        normalized_weight:
          type: number
          minimum: 0
          maximum: 1
        contribution:
          description: normalized_weight x score.
          type: number
        criterion_name:
          type: string
        assessment_state:
          $ref: '#/components/schemas/AssessmentState'
        reason:
          type: string
    ScoreExclusion:
      description: 'An entry that carried weight but could not be scored, so it is
        absent from both

        the numerator and the divisor. Reported rather than dropped: without it the
        divisor

        appears from nowhere, and a reviewer cannot see that a quarter of the interview
        is

        missing from the number.

        '
      type: object
      additionalProperties: false
      required:
      - key
      - weight
      - normalized_weight
      properties:
        key:
          type: string
        weight:
          type: number
          minimum: 0
        normalized_weight:
          type: number
          minimum: 0
          maximum: 1
        criterion_name:
          type: string
        assessment_state:
          $ref: '#/components/schemas/AssessmentState'
        reason:
          description: Why this entry could not be scored, taken from the report item''s
            uncertainty.
          type: string
    ScoreBreakdown:
      description: 'The arithmetic behind a score, so the console renders it rather
        than asserts it.

        denominator is the part that cannot be inferred from the number alone: 82 out
        of the

        whole interview and 82 out of the 70% of it that could be judged are different
        claims.

        '
      type: object
      additionalProperties: false
      required:
      - numerator
      - denominator
      - contributions
      - exclusions
      properties:
        numerator:
          type: number
        denominator:
          description: Sum of the normalized weights that were actually scored. Below
            1.0 whenever something was excluded.
          type: number
          minimum: 0
          maximum: 1
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/ScoreContribution'
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/ScoreExclusion'
    ReportItemView:
      type: object
      additionalProperties: false
      required:
      - report_item_id
      - criterion_id
      - criterion_name
      - assessment_state
      - observation
      - rationale
      - evidence
      - uncertainty
      - axis_assessments
      properties:
        report_item_id:
          type: string
          format: uuid
        criterion_id:
          type: string
          format: uuid
        criterion_name:
          description: Criterion name captured when the report was generated, so a
            reviewer never reads a bare UUID and the report survives deletion of the
            criterion version. Empty only for reports generated before this field
            existed.
          type: string
          maxLength: 200
        assessment_state:
          $ref: '#/components/schemas/AssessmentState'
        observation:
          type: string
        rationale:
          type: string
        uncertainty:
          type: string
        follow_up_question:
          type:
          - string
          - 'null'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceView'
        axis_assessments:
          description: Empty for reports generated before scoring existed, which the
            console reads as "this report has no scores".
          type: array
          items:
            $ref: '#/components/schemas/AxisAssessmentView'
        average_score:
          description: 'Weighted mean of this item''s scored axes. Unscored axes are
            left out of both

            the numerator and the divisor rather than counted as zero.

            '
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
        criterion_weight:
          description: 'What this criterion counted for in the report score, frozen
            when the report

            was generated. 1 on reports scored before weights existed, which counted
            every

            criterion equally.

            '
          type: number
          minimum: 0
        axis_breakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
    RequirementAssessmentStatus:
      type: string
      enum:
      - met
      - partially_met
      - not_met
      - unknown
    RequirementEvidenceView:
      type: object
      additionalProperties: false
      required:
      - evidence_id
      - source_kind
      - source_type
      - excerpt
      - locator
      - relation
      - explanation
      properties:
        evidence_id:
          type: string
          format: uuid
        source_kind:
          type: string
          enum:
          - submission
          - interview
        source_type:
          type: string
        excerpt:
          type: string
        locator:
          type: object
          additionalProperties: true
        relation:
          type: string
          enum:
          - supports
          - partially_supports
          - contradicts
        explanation:
          type: string
    RequirementHumanOverrideView:
      type: object
      additionalProperties: false
      required:
      - status
      - reason
      - created_at
      properties:
        status:
          $ref: '#/components/schemas/RequirementAssessmentStatus'
        reason:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
    RequirementAssessmentView:
      type: object
      additionalProperties: false
      required:
      - requirement_assessment_id
      - job_requirement_id
      - requirement_type
      - statement
      - status
      - rationale
      - confidence
      - evidence
      - human_override
      properties:
        requirement_assessment_id:
          type: string
          format: uuid
        job_requirement_id:
          type: string
          format: uuid
        requirement_type:
          type: string
          enum:
          - required
          - preferred
        statement:
          type: string
        status:
          $ref: '#/components/schemas/RequirementAssessmentStatus'
        rationale:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/RequirementEvidenceView'
        human_override:
          oneOf:
          - $ref: '#/components/schemas/RequirementHumanOverrideView'
          - type: 'null'
    ReportView:
      type: object
      additionalProperties: false
      required:
      - report_id
      - report_version
      - status
      - summary
      - items
      - requirement_assessments
      - ai_original_immutable
      properties:
        report_id:
          type: string
          format: uuid
        report_version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - generating
          - ready
          - partial
          - failed
        summary:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportItemView'
        requirement_assessments:
          description: Required and preferred qualification fulfillment, kept separate from interview scores.
          type: array
          items:
            $ref: '#/components/schemas/RequirementAssessmentView'
        overall_score:
          description: 'Weighted mean across the criteria that could be scored, using
            the weights

            the company published and the report froze. Explicitly not a hiring score
            - it says

            nothing about the criteria the interview never reached, which is why the
            console shows

            it beside unscored_criteria_count and scoring_breakdown.denominator, and
            the final

            decision stays with a person.

            '
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
        communication_score:
          description: Communication score calculated separately from competency scores.
            null means the answers did not provide enough evidence to judge delivery.
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
        communication_scored_criteria_count:
          description: Number of criteria whose answers supported a communication score.
          type: integer
          minimum: 0
        unscored_criteria_count:
          description: How many criteria produced no score, so the reviewer can see
            what overall_score does not cover.
          type: integer
          minimum: 0
        scoring_breakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        ai_original_immutable:
          type: boolean
          const: true
        human_reviews:
          type: array
          items:
            $ref: '#/components/schemas/HumanReviewView'
    QuestionRationaleView:
      type: object
