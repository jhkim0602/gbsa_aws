openapi: 3.1.0
info:
  title: Interview Evidence Platform API
  version: 1.0.0
  description: 'Contract baseline for the Korean-language pilot. All company routes
    enforce the company_id

    from the authenticated principal. Applicant routes enforce the invitation-scoped
    session

    cookie; neither API accepts company_id from an untrusted request body.

    '
servers:
- url: /v1
tags:
- name: Company
- name: Hiring
- name: Applicant Access
- name: Submission
- name: Interview
- name: Reporting
- name: Assistant
- name: Privacy
paths:
  /me:
    $ref: ./paths/company/paths.yaml#/~1me
  /positions:
    $ref: ./paths/company/paths.yaml#/~1positions
  /positions/{position_id}:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}
  /interviewer-profiles:
    $ref: ./paths/company/paths.yaml#/~1interviewer-profiles
  /positions/{position_id}/competency-model-versions:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1competency-model-versions
  /competency-model-versions/{version_id}/publish:
    $ref: ./paths/company/paths.yaml#/~1competency-model-versions~1{version_id}~1publish
  /positions/{position_id}/invitations:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1invitations
  /invitations/{invitation_id}/recruiting-state:
    $ref: ./paths/company/paths.yaml#/~1invitations~1{invitation_id}~1recruiting-state
  /recruiting-stages:
    $ref: ./paths/company/paths.yaml#/~1recruiting-stages
  /positions/{position_id}/recruiting-stages:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1recruiting-stages
  /positions/{position_id}/recruiting-stages/reorder:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1recruiting-stages~1reorder
  /positions/{position_id}/recruiting-stages/{stage_id}:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1recruiting-stages~1{stage_id}
  /positions/{position_id}/recruiting-stages/{stage_id}/delete:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1recruiting-stages~1{stage_id}~1delete
  /positions/{position_id}/invitations/recruiting-stage:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1invitations~1recruiting-stage
  /invitation-email-template:
    $ref: ./paths/company/paths.yaml#/~1invitation-email-template
  /invitation-email-template/preview:
    $ref: ./paths/company/paths.yaml#/~1invitation-email-template~1preview
  /invitation-email-template/logo:
    $ref: ./paths/company/paths.yaml#/~1invitation-email-template~1logo
  /positions/{position_id}/invitation-email-template:
    $ref: ./paths/company/paths.yaml#/~1positions~1{position_id}~1invitation-email-template
  /public/companies/{company_id}/logo:
    $ref: ./paths/company/paths.yaml#/~1public~1companies~1{company_id}~1logo
  /applicant/access/exchange:
    $ref: ./paths/company/paths.yaml#/~1applicant~1access~1exchange
  /applicant/access/preview:
    $ref: ./paths/company/paths.yaml#/~1applicant~1access~1preview
  /applicant/access/revoke:
    $ref: ./paths/company/paths.yaml#/~1applicant~1access~1revoke
  /applicant/identity-verifications:
    $ref: ./paths/company/paths.yaml#/~1applicant~1identity-verifications
  /applicant/consents:
    $ref: ./paths/company/paths.yaml#/~1applicant~1consents
  /applicant/submissions/upload-intents:
    $ref: ./paths/submission/paths.yaml#/~1applicant~1submissions~1upload-intents
  /applicant/submission-workspace:
    $ref: ./paths/submission/paths.yaml#/~1applicant~1submission-workspace
  /applicant/submissions:
    $ref: ./paths/submission/paths.yaml#/~1applicant~1submissions
  /company/invitations/{invitation_id}/submissions:
    $ref: ./paths/submission/paths.yaml#/~1company~1invitations~1{invitation_id}~1submissions
  /applicant/analysis-status:
    $ref: ./paths/submission/paths.yaml#/~1applicant~1analysis-status
  /applicant/equipment-checks:
    $ref: ./paths/interview/paths.yaml#/~1applicant~1equipment-checks
  /applicant/interview-sessions:
    $ref: ./paths/interview/paths.yaml#/~1applicant~1interview-sessions
  /applicant/interview-sessions/{session_id}/resume:
    $ref: ./paths/interview/paths.yaml#/~1applicant~1interview-sessions~1{session_id}~1resume
  /applicant/interview-sessions/{session_id}/media-upload-intents:
    $ref: ./paths/interview/paths.yaml#/~1applicant~1interview-sessions~1{session_id}~1media-upload-intents
  /applicant/interview-sessions/{session_id}/media-uploads:
    $ref: ./paths/interview/paths.yaml#/~1applicant~1interview-sessions~1{session_id}~1media-uploads
  /interview-sessions/{session_id}/report:
    $ref: ./paths/reporting/paths.yaml#/~1interview-sessions~1{session_id}~1report
  /interview-sessions/{session_id}/timeline:
    $ref: ./paths/reporting/paths.yaml#/~1interview-sessions~1{session_id}~1timeline
  /reports/{report_id}/items/{report_item_id}/reviews:
    $ref: ./paths/reporting/paths.yaml#/~1reports~1{report_id}~1items~1{report_item_id}~1reviews
  /reports/{report_id}/requirements/{requirement_assessment_id}/reviews:
    $ref: ./paths/reporting/paths.yaml#/~1reports~1{report_id}~1requirements~1{requirement_assessment_id}~1reviews
  /interview-sessions/{session_id}/review-artifacts:
    $ref: ./paths/reporting/paths.yaml#/~1interview-sessions~1{session_id}~1review-artifacts
  /invitations/{invitation_id}/final-decisions:
    $ref: ./paths/reporting/paths.yaml#/~1invitations~1{invitation_id}~1final-decisions
  /assistant/search:
    $ref: ./paths/assistant/paths.yaml#/~1assistant~1search
  /assistant/answers:
    $ref: ./paths/assistant/paths.yaml#/~1assistant~1answers
  /assistant/answers/stream:
    $ref: ./paths/assistant/paths.yaml#/~1assistant~1answers~1stream
  /privacy/deletion-requests:
    $ref: ./paths/reporting/paths.yaml#/~1privacy~1deletion-requests
  /privacy/deletion-requests/{deletion_request_id}:
    $ref: ./paths/reporting/paths.yaml#/~1privacy~1deletion-requests~1{deletion_request_id}
components:
  securitySchemes:
    CompanyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApplicantSession:
      type: apiKey
      in: cookie
      name: iep_applicant_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CompanyId:
      name: company_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: position_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportItemId:
      name: report_item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Structured error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    AssistantSearchRequest:
      type: object
      additionalProperties: false
      required:
      - scope
      - query
      properties:
        scope:
          type: string
          enum:
          - company
          - position
        position_id:
          type:
          - string
          - 'null'
          format: uuid
        query:
          type: string
          minLength: 1
          maxLength: 2000
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
    AssistantSearchSource:
      type: object
      additionalProperties: false
      required:
      - source_id
      - position_id
      - applicant_id
      - invitation_id
      - report_id
      - report_item_id
      - criterion_id
      - document_type
      - excerpt
      - score
      - score_components
      - metadata
      properties:
        source_id:
          type: string
          format: uuid
        position_id:
          type: string
          format: uuid
        applicant_id:
          type: string
          format: uuid
        invitation_id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        report_item_id:
          type:
          - string
          - 'null'
          format: uuid
        criterion_id:
          type:
          - string
          - 'null'
          format: uuid
        document_type:
          type: string
        excerpt:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        score_components:
          type: object
          additionalProperties:
            type: number
        metadata:
          type: object
          additionalProperties: true
    AssistantSearchResponse:
      type: object
      additionalProperties: false
      required:
      - scope
      - position_id
      - sources
      properties:
        scope:
          type: string
          enum:
          - company
          - position
        position_id:
          type:
          - string
          - 'null'
          format: uuid
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AssistantSearchSource'
    AssistantAnswerResponse:
      type: object
      additionalProperties: false
      required:
      - scope
      - position_id
      - answer
      - sources
      - degraded_mode
      properties:
        scope:
          type: string
          enum:
          - company
          - position
        position_id:
          type:
          - string
          - 'null'
          format: uuid
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AssistantSearchSource'
        degraded_mode:
          type:
          - string
          - 'null'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      - retryable
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        current_version:
          type: integer
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            properties:
              field:
                type: string
              code:
                type: string
    CompanyUserView:
      type: object
      additionalProperties: false
      required:
      - company_user_id
      - company_id
      - email
      - status
      properties:
        company_user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - invited
          - active
          - disabled
    PositionCreate:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      - submission_requirements
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
        role_type:
          type:
          - string
          - 'null'
          maxLength: 100
        headcount:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
        applicant_capacity:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 100000
        interview_capacity:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 400
        interview_at:
          type:
          - string
          - 'null'
          format: date-time
        recruitment_start_at:
          type:
          - string
          - 'null'
          format: date
        recruitment_end_at:
          type:
          - string
          - 'null'
          format: date
        submission_requirements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubmissionRequirement'
    PositionUpdate:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      - status
      - submission_requirements
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
        role_type:
          type:
          - string
          - 'null'
          maxLength: 100
        headcount:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
        applicant_capacity:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 100000
        interview_capacity:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 400
        interview_at:
          type:
          - string
          - 'null'
          format: date-time
        recruitment_start_at:
          type:
          - string
          - 'null'
          format: date
        recruitment_end_at:
          type:
          - string
          - 'null'
          format: date
        submission_requirements:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubmissionRequirement'
        status:
          type: string
          enum:
          - draft
          - active
          - closed
    Position:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/PositionCreate'
      - type: object
        required:
        - position_id
        - status
        - row_version
        - created_at
        properties:
          position_id:
            type: string
            format: uuid
          status:
            type: string
            enum:
            - draft
            - active
            - closed
          row_version:
            type: integer
            minimum: 1
          created_at:
            type: string
            format: date-time
    PositionPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        next_cursor:
          type:
          - string
          - 'null'
    InterviewerProfileCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - tone
      - voice_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        tone:
          type: string
          enum:
          - calm
          - friendly
          - analytical
          - concise
        voice_id:
          type: string
          minLength: 1
          maxLength: 100
    InterviewerProfile:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/InterviewerProfileCreate'
      - type: object
        required:
        - interviewer_profile_id
        - row_version
        - created_at
        properties:
          interviewer_profile_id:
            type: string
            format: uuid
          row_version:
            type: integer
            minimum: 1
          created_at:
            type: string
            format: date-time
    InterviewerProfilePage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InterviewerProfile'
        next_cursor:
          type:
          - string
          - 'null'
    InterviewerPersonaDefinition:
      type: object
      additionalProperties: false
      required:
      - name
      - tone
      - voice_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        tone:
          type: string
          enum:
          - calm
          - friendly
          - analytical
          - concise
        voice_id:
          type: string
          minLength: 1
          maxLength: 100
    JobRequirementInput:
      type: object
      additionalProperties: false
      required:
      - requirement_type
      - statement
      - priority
      - criterion_code
      properties:
        requirement_type:
          type: string
          enum:
          - required
          - preferred
        statement:
          type: string
          minLength: 1
          maxLength: 4000
        priority:
          type: integer
          minimum: 1
          maximum: 5
        criterion_code:
          type: string
          pattern: ^[A-Z0-9_-]{2,40}$
    CriterionVerificationGuide:
      type: object
      additionalProperties: false
      required:
      - observable_dimensions
      - strong_answer_signals
      - weak_answer_signals
      - follow_up_directions
      - max_follow_ups
      - time_budget_seconds
      properties:
        observable_dimensions:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 500
        strong_answer_signals:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 1000
        weak_answer_signals:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 1000
        follow_up_directions:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 500
        max_follow_ups:
          type: integer
          minimum: 0
          maximum: 3
        time_budget_seconds:
          type: integer
          minimum: 60
          maximum: 1800
    EvaluationCriterionInput:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - description
      - weight
      - verification_guide
      - abstain_guidance
      - required
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_-]{2,40}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        weight:
          type: number
          minimum: 0
        verification_guide:
          $ref: '#/components/schemas/CriterionVerificationGuide'
        abstain_guidance:
          type: string
          minLength: 1
        common_questions:
          type: array
          items:
            type: string
        required:
          type: boolean
    InterviewLevel:
      description: 'How deep the AI interviewer digs. The level selects the
        question-depth instructions the model is given; it never changes the configured
        follow-up budget or which criteria are verified. Versions published before the
        toggle existed read back as `junior`.

        '
      type: string
      enum:
      - entry
      - junior
      - senior
      default: junior
    AssessmentAxisWeights:
      description: 'How much each of the five scoring axes counts toward a criterion''s
        score.

        Either omitted/empty, meaning equal weight, or naming every axis and totalling
        100 --

        the same rule the criterion weights follow, so one slider means one share on
        both

        screens. A partial mapping is refused: reading the absent keys as zero drops
        those

        axes out of the score and reading them as one adds incomparable scales, and
        neither is

        visible to the reviewer. A weight of zero is allowed and means the axis is
        not looked

        at for this position. Versions published before weights existed carry an empty
        mapping,

        which is how their reports were actually scored.

        '
      type: object
      additionalProperties: false
      properties:
        correctness:
          type: number
          minimum: 0
          maximum: 100
        depth:
          type: number
          minimum: 0
          maximum: 100
        fundamentals:
          type: number
          minimum: 0
          maximum: 100
        ownership:
          type: number
          minimum: 0
          maximum: 100
        communication:
          type: number
          minimum: 0
          maximum: 100
    CompetencyModelVersionCreate:
      type: object
      additionalProperties: false
      required:
      - job_requirements
      - criteria
      - prohibited_topics
      - interview_duration_minutes
      properties:
        job_requirements:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/JobRequirementInput'
        criteria:
          type: array
          minItems: 1
          maxItems: 12
          description: Criterion weights must total exactly 100.
          items:
            $ref: '#/components/schemas/EvaluationCriterionInput'
        prohibited_topics:
          type: array
          items:
            type: string
        interview_duration_minutes:
          type: integer
          enum:
          - 30
          description: All newly configured interviews use the fixed 30-minute format.
        interview_level:
          $ref: '#/components/schemas/InterviewLevel'
        axis_weights:
          $ref: '#/components/schemas/AssessmentAxisWeights'
        persona_definition:
          $ref: '#/components/schemas/InterviewerPersonaDefinition'
    CompetencyModelVersion:
      type: object
      additionalProperties: false
      required:
      - competency_model_version_id
      - position_id
      - version_number
      - job_requirements
      - criteria
      - prohibited_topics
      - interview_duration_minutes
      - status
      - row_version
      properties:
        competency_model_version_id:
          type: string
          format: uuid
        position_id:
          type: string
          format: uuid
        version_number:
          type: integer
          minimum: 1
        job_requirements:
          type: array
          maxItems: 50
          description: Legacy versions can be empty; new version requests require
            at least one item.
          items:
            $ref: '#/components/schemas/JobRequirementInput'
        criteria:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/EvaluationCriterionInput'
        prohibited_topics:
          type: array
          items:
            type: string
        interview_duration_minutes:
          type: integer
          minimum: 10
          maximum: 120
        interview_level:
          $ref: '#/components/schemas/InterviewLevel'
        axis_weights:
          $ref: '#/components/schemas/AssessmentAxisWeights'
        persona_definition:
          $ref: '#/components/schemas/InterviewerPersonaDefinition'
        status:
          type: string
          enum:
          - draft
          - published
          - retired
        row_version:
          type: integer
          minimum: 1
        published_at:
          type:
          - string
          - 'null'
          format: date-time
    CompetencyModelVersionPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompetencyModelVersion'
        next_cursor:
          type:
          - string
          - 'null'
    InvitationBatchCreate:
      type: object
      additionalProperties: false
      required:
      - applicants
      - expires_at
      properties:
        applicants:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - email
            - display_name
            properties:
              email:
                type: string
                format: email
              display_name:
                type: string
                minLength: 1
                maxLength: 200
        expires_at:
          type: string
          format: date-time
        delivery_method:
          type: string
          enum:
          - email
          - manual_link
          default: email
    InvitationView:
      type: object
      additionalProperties: false
      required:
      - invitation_id
      - position_id
      - competency_model_version_id
      - applicant_email
      - status
      - expires_at
      - row_version
      properties:
        invitation_id:
          type: string
          format: uuid
        position_id:
          type: string
          format: uuid
        competency_model_version_id:
          type: string
          format: uuid
        applicant_email:
          type: string
          format: email
        applicant_display_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - invited
