    responses:
      '200':
        description: Server-versioned policy content displayed before consent
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/ConsentPolicyView
      default:
        $ref: ../../root.yaml#/components/responses/Error
  post:
