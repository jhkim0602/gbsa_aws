          schema:
            $ref: ../../root.yaml#/components/schemas/PositionUpdate
    responses:
      '200':
        description: Position settings and lifecycle updated
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/Position
      default:
        $ref: ../../root.yaml#/components/responses/Error
