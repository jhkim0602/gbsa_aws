/applicant/access/exchange:
  post:
    operationId: exchangeApplicantInvitationToken
    x-owner-lane: A
    tags:
    - Applicant Access
    security: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../root.yaml#/components/schemas/ApplicantTokenExchange
    responses:
      '204':
        description: 'Scoped, expiring HttpOnly session cookie set. Raw invitation
          token is not returned.

          '
        headers:
          Set-Cookie:
            schema:
              type: string
      default:
        $ref: ../../root.yaml#/components/responses/Error
/applicant/access/revoke:
  post:
    operationId: revokeApplicantSession
    x-owner-lane: A
    tags:
    - Applicant Access
    security:
    - ApplicantSession: []
    responses:
      '204':
        description: Current applicant session revoked and cookie cleared
        headers:
          Set-Cookie:
            schema:
              type: string
      default:
        $ref: ../../root.yaml#/components/responses/Error
/applicant/identity-verifications:
  post:
    operationId: verifyApplicantIdentity
    x-owner-lane: A
    tags:
    - Applicant Access
    security:
    - ApplicantSession: []
    parameters:
