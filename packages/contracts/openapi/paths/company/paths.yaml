/recruiting-stages:
  get:
    operationId: listRecruitingStages
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - name: position_id
      in: query
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Tenant-scoped recruiting stages, ordered within each position
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/RecruitingStagePage
      default:
        $ref: ../../root.yaml#/components/responses/Error
/positions/{position_id}/recruiting-stages:
  post:
    operationId: createRecruitingStage
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/PositionId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - name
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 40
    responses:
      '201':
        description: Recruiting stage created at the end of the board
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/RecruitingStage
      default:
        $ref: ../../root.yaml#/components/responses/Error
/positions/{position_id}/recruiting-stages/{stage_id}:
  patch:
    operationId: updateRecruitingStage
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/PositionId
    - name: stage_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../../root.yaml#/components/parameters/IfMatchVersion
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - name
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 40
    responses:
      '200':
        description: Recruiting stage renamed
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/RecruitingStage
      default:
        $ref: ../../root.yaml#/components/responses/Error
/positions/{position_id}/recruiting-stages/reorder:
  post:
    operationId: reorderRecruitingStages
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/PositionId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - ordered_stage_ids
            properties:
              ordered_stage_ids:
                type: array
                minItems: 1
                maxItems: 20
                uniqueItems: true
                items:
                  type: string
                  format: uuid
    responses:
      '200':
        description: Recruiting stages reordered
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/RecruitingStagePage
      default:
        $ref: ../../root.yaml#/components/responses/Error
/positions/{position_id}/recruiting-stages/{stage_id}/delete:
  post:
    operationId: deleteRecruitingStage
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/PositionId
    - name: stage_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - replacement_stage_id
            properties:
              replacement_stage_id:
                type: string
                format: uuid
    responses:
      '200':
        description: Stage deleted after its applicants are moved to the replacement
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/RecruitingStagePage
      default:
        $ref: ../../root.yaml#/components/responses/Error
/positions/{position_id}/invitations/recruiting-stage:
  patch:
    operationId: moveApplicantsToRecruitingStage
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/PositionId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - target_stage_id
            - applicants
            properties:
              target_stage_id:
                type: string
                format: uuid
              applicants:
                type: array
                minItems: 1
                maxItems: 1000
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - invitation_id
                  - expected_version
                  properties:
                    invitation_id:
                      type: string
                      format: uuid
                    expected_version:
                      type: integer
                      minimum: 1
    responses:
      '200':
        description: Applicants moved to their latest recruiting stage without history
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/ApplicantPipelineAssignmentPage
      default:
        $ref: ../../root.yaml#/components/responses/Error
