/me:
  get:
    operationId: getCurrentCompanyUser
    x-owner-lane: A
    tags:
    - Company
    security:
    - CompanyBearer: []
    responses:
      '200':
        description: Authenticated company user and tenant
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/CompanyUserView
      default:
        $ref: ../../root.yaml#/components/responses/Error
/positions:
  get:
    operationId: listPositions
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/Cursor
    - $ref: ../../root.yaml#/components/parameters/Limit
    responses:
      '200':
        description: Tenant-scoped positions
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/PositionPage
      default:
        $ref: ../../root.yaml#/components/responses/Error
  post:
    operationId: createPosition
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../root.yaml#/components/schemas/PositionCreate
    responses:
      '201':
        description: Position created
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/Position
      default:
        $ref: ../../root.yaml#/components/responses/Error
/positions/{position_id}:
  get:
    operationId: getPosition
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/PositionId
    responses:
      '200':
        description: Tenant-scoped position details
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/Position
      default:
        $ref: ../../root.yaml#/components/responses/Error
  patch:
    operationId: updatePosition
    x-owner-lane: A
    tags:
    - Hiring
    security:
    - CompanyBearer: []
    parameters:
    - $ref: ../../root.yaml#/components/parameters/PositionId
    - $ref: ../../root.yaml#/components/parameters/IfMatchVersion
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../../root.yaml#/components/schemas/PositionUpdate
    responses:
      '200':
        description: Position settings and lifecycle updated
        content:
          application/json:
            schema:
              $ref: ../../root.yaml#/components/schemas/Position
      default:
        $ref: ../../root.yaml#/components/responses/Error
