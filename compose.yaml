name: interview-evidence-platform

# Local infrastructure only -- Postgres, DynamoDB, LocalStack and Mailpit. The API and worker are
# here: they run on the host with `make api` / `make worker`, against the production runtime
# (`create_production_runtime`) that the deployed environment uses. There is no separate local
# application wiring to keep in sync, and no image to rebuild after every edit.
#
# Everything reachable through an endpoint override lands here; everything else -- Bedrock,
# Cognito, Transcribe, Polly and MediaConvert -- goes to real AWS, because
# `runtime/aws.py:_client_factory` only redirects the services listed there. That is deliberate:
# see docs/local-development.md for what it means and what it costs.
# PDF OCR uses GCP Document AI through the same service account as GCP speech.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_evidence}
      POSTGRES_USER: ${POSTGRES_USER:-iep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-iep} -d ${POSTGRES_DB:-interview_evidence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # No `SERVICES` whitelist. The runtime endpoint-overrides s3, sqs, sesv2 and secretsmanager
  # (`runtime/aws.py:_client_factory`), and pinning a list means one wrong service name turns a
  # working call into a connection refused. Unset, LocalStack starts each community service on
  # first use, which covers all four without naming any.
  #
  # The local API sends invitation mail directly to Mailpit over SMTP. SES remains available in
  # LocalStack for AWS adapter tests, but is not the local invitation delivery path.
  localstack:
    image: localstack/localstack:3.8
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - localstack-data:/var/lib/localstack

  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.22.3
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8025/api/v1/info >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  localstack-data:
