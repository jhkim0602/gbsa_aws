name: interview-evidence-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_evidence}
      POSTGRES_USER: ${POSTGRES_USER:-iep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-iep} -d ${POSTGRES_DB:-interview_evidence}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "test -d /data"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - dynamodb-data:/data

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - localstack-data:/var/lib/localstack

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  api:
    build:
      context: .
      dockerfile: backend/Containerfile
      target: api
    environment:
      APP_ENV: local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ENDPOINT_URL: http://localstack:4566
      DATABASE_URL: postgresql+psycopg://iep:local-only-password@postgres:5432/interview_evidence
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      OPENSEARCH_ENDPOINT: http://opensearch:9200
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Containerfile
      target: worker
    environment:
      APP_ENV: local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ENDPOINT_URL: http://localstack:4566
      DATABASE_URL: postgresql+psycopg://iep:local-only-password@postgres:5432/interview_evidence
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      OPENSEARCH_ENDPOINT: http://opensearch:9200
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/iep-worker-ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  company-console:
    build:
      context: .
      dockerfile: apps/Containerfile
      target: company-console
    ports:
      - "${COMPANY_CONSOLE_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  applicant-interview:
    build:
      context: .
      dockerfile: apps/Containerfile
      target: applicant-interview
    ports:
      - "${APPLICANT_INTERVIEW_PORT:-5174}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  dynamodb-data:
  localstack-data:
  opensearch-data:
