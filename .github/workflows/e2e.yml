name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 1-5"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the local production stack
        run: make compose-up

      - name: Run browser journeys
        env:
          COMPANY_E2E_BASE_URL: http://127.0.0.1:5173
          APPLICANT_E2E_BASE_URL: http://127.0.0.1:5174
        run: |
          npx playwright test --config playwright.config.ts \
            --project company-chrome --project applicant-chrome

      - name: Collect stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Save browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: tests/browser/artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: make compose-down
