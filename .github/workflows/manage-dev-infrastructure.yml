name: Manage Dev Infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create/update or remove the complete development environment
        required: true
        type: choice
        default: up
        options:
          - up
          - down
      source_ref:
        description: Application source to deploy when bringing the environment up
        required: true
        type: choice
        default: develop
        options:
          - develop
          - main
      confirm_destroy:
        description: Enter destroy-dev when operation is down
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: manage-dev-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TERRAFORM_VERSION: 1.13.3

jobs:
  manage:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate request
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "down" && "$CONFIRM_DESTROY" != "destroy-dev" ]]; then
            echo "::error::Enter destroy-dev in the confirmation field."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-node@v4
        if: ${{ inputs.operation == 'up' }}
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Manage complete development environment
        env:
          TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          DEMO_COMPANY_EMAIL: ${{ vars.DEMO_COMPANY_EMAIL }}
        run: |
          scripts/manage_dev_infrastructure.sh \
            "${{ inputs.operation }}" \
            "${{ inputs.confirm_destroy }}"
