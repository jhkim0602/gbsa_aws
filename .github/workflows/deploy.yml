name: Deploy

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TERRAFORM_VERSION: 1.13.3

jobs:
  settings:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      dev_root: ${{ steps.resolve.outputs.dev_root }}
      apply_infrastructure: ${{ steps.resolve.outputs.apply_infrastructure }}
      approval_environment: ${{ steps.resolve.outputs.approval_environment }}
    steps:
      - id: resolve
        run: |
          set -euo pipefail
          echo "environment=prod" >> "$GITHUB_OUTPUT"
          echo "dev_root=application" >> "$GITHUB_OUTPUT"
          echo "apply_infrastructure=true" >> "$GITHUB_OUTPUT"
          echo "approval_environment=prod-approval" >> "$GITHUB_OUTPUT"
          echo "Deploying production from merged main PR" >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: [settings]
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-plan', needs.settings.outputs.environment) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `format:check`, `lint` and `typecheck` each run a Python half (ruff, ruff, mypy)
      # through `uv`, so all three exit 127 without this.
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true

      - run: npm ci
      - run: uv sync --frozen --no-editable
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # No browser build here, deliberately. Vite inlines `import.meta.env` at build time and
      # the console's Cognito configuration -- login domain, client id, and the CloudFront
      # origin it redirects back to -- does not exist until the infrastructure has been
      # applied. A bundle built at this point compiles cleanly with those values absent,
      # `readCompanyAuthConfig` returns null, and the console falls back to a demo token the
      # deployed API rejects. The build therefore lives in `deploy_frontends`, after apply,
      # where it can read them from state.

  terraform_plan:
    needs: [settings]
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-plan', needs.settings.outputs.environment) }}
    outputs:
      root: ${{ steps.target.outputs.root }}
      resource_name: ${{ steps.target.outputs.resource_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Select immutable Terraform root
        id: target
        env:
          ENVIRONMENT: ${{ needs.settings.outputs.environment }}
          DEV_ROOT: ${{ needs.settings.outputs.dev_root }}
          RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
        run: |
          set -euo pipefail
          if [[ "$ENVIRONMENT" == "dev" ]]; then
            ROOT="infra/environments/dev/$DEV_ROOT"
          else
            ROOT="infra/environments/$ENVIRONMENT"
          fi
          NAME="${RESOURCE_PREFIX:-iep-$ENVIRONMENT}"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "resource_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Initialize remote state
        working-directory: ${{ steps.target.outputs.root }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      - name: Write environment variables
        env:
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
          ROOT: ${{ steps.target.outputs.root }}
        run: |
          set -euo pipefail
          test -n "$TF_VARS_JSON"
          printf '%s' "$TF_VARS_JSON" > "$ROOT/terraform.tfvars.json"

      - name: Create saved plan
        working-directory: ${{ steps.target.outputs.root }}
        run: terraform plan -input=false -out=tfplan

      # Not a dot-directory. `upload-artifact` defaults `include-hidden-files` to false and
      # treats a leading dot anywhere in the path as hidden, so `.deploy-plan` uploaded
      # nothing at all: the copy below succeeded, then the upload failed with `No files were
      # found with the provided path` and every downstream job skipped. Enabling hidden files
      # would fix the symptom and weaken a default that exists to keep `.git` and `.env` out
      # of artifacts -- while a saved plan carries subnet and security group ids.
      - name: Create review artifact
        env:
          ROOT: ${{ steps.target.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p deploy-plan
          cp "$ROOT/tfplan" deploy-plan/tfplan
          terraform -chdir="$ROOT" show -no-color tfplan > deploy-plan/tfplan.txt

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: deploy-plan
          if-no-files-found: error
          retention-days: 1

  approval:
    needs: [settings, terraform_plan]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.settings.outputs.approval_environment }}
    steps:
      - run: echo "Production plan accepted for merged main PR"

  terraform_apply:
    needs: [settings, terraform_plan, approval]
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-deploy', needs.settings.outputs.environment) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize approved root
        working-directory: ${{ needs.terraform_plan.outputs.root }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: deploy-plan

      - name: Apply exact saved plan
        if: ${{ needs.settings.outputs.apply_infrastructure == 'true' }}
        working-directory: ${{ needs.terraform_plan.outputs.root }}
        run: |
          cp "$GITHUB_WORKSPACE/deploy-plan/tfplan" tfplan
          terraform apply -input=false tfplan

  build_images:
    needs: [settings, terraform_plan, terraform_apply]
    # The foundation and data-ai roots contain no ECS service, so there is nothing to
    # deploy an image onto and the jobs below would fail describing a service that the
    # root never creates.
    if: ${{ needs.settings.outputs.environment != 'dev' || needs.settings.outputs.dev_root == 'application' }}
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-deploy', needs.settings.outputs.environment) }}
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      worker_image: ${{ steps.images.outputs.worker_image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish immutable images
        id: images
        env:
          RESOURCE_NAME: ${{ needs.terraform_plan.outputs.resource_name }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          API_IMAGE="$REGISTRY/$RESOURCE_NAME/api:$GITHUB_SHA"
          WORKER_IMAGE="$REGISTRY/$RESOURCE_NAME/worker:$GITHUB_SHA"
          docker build --target api --tag "$API_IMAGE" --file backend/Containerfile .
          docker build --target worker --tag "$WORKER_IMAGE" --file backend/Containerfile .
          docker push "$API_IMAGE"
          docker push "$WORKER_IMAGE"
          echo "api_image=$API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "worker_image=$WORKER_IMAGE" >> "$GITHUB_OUTPUT"

  render_task_definitions:
    needs: [settings, terraform_plan, build_images]
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-deploy', needs.settings.outputs.environment) }}
    outputs:
      api_task_definition: ${{ steps.register.outputs.api_task_definition }}
      worker_task_definition: ${{ steps.register.outputs.worker_task_definition }}
      resource_name: ${{ needs.terraform_plan.outputs.resource_name }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register image-owned task definition revisions
        id: register
        env:
          RESOURCE_NAME: ${{ needs.terraform_plan.outputs.resource_name }}
          API_IMAGE: ${{ needs.build_images.outputs.api_image }}
          WORKER_IMAGE: ${{ needs.build_images.outputs.worker_image }}
        run: |
          set -euo pipefail
          for SERVICE in api worker; do
            aws ecs describe-task-definition \
              --task-definition "$RESOURCE_NAME-$SERVICE" \
              --query taskDefinition > "$SERVICE-current.json"
            IMAGE_VAR="${SERVICE^^}_IMAGE"
            jq --arg image "${!IMAGE_VAR}" --arg service "$SERVICE" '
              del(
                .compatibilities,
                .enableFaultInjection,
                .registeredAt,
                .registeredBy,
                .requiresAttributes,
                .revision,
                .status,
                .taskDefinitionArn
              )
              | .containerDefinitions |= map(
                  if .name == $service then .image = $image else . end
                )
            ' "$SERVICE-current.json" > "$SERVICE-next.json"
          done
          API_TASK_DEFINITION="$(aws ecs register-task-definition \
            --cli-input-json file://api-next.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          WORKER_TASK_DEFINITION="$(aws ecs register-task-definition \
            --cli-input-json file://worker-next.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          echo "api_task_definition=$API_TASK_DEFINITION" >> "$GITHUB_OUTPUT"
          echo "worker_task_definition=$WORKER_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

  migrate_database:
    needs: [settings, render_task_definitions]
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-deploy', needs.settings.outputs.environment) }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Alembic in the private ECS network
        env:
          RESOURCE_NAME: ${{ needs.render_task_definitions.outputs.resource_name }}
          WORKER_TASK_DEFINITION: ${{ needs.render_task_definitions.outputs.worker_task_definition }}
        run: |
          set -euo pipefail
          CLUSTER="$RESOURCE_NAME"
          SERVICE="$RESOURCE_NAME-worker"
          NETWORK_CONFIGURATION="$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json)"
          OVERRIDES="$(jq -nc '{
            containerOverrides: [{
              name: "worker",
              command: [
                "uv", "run", "--no-sync", "python",
                "-m", "interview_evidence.migrate"
              ]
            }]
          }')"
          TASK_ARN="$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$WORKER_TASK_DEFINITION" \
            --network-configuration "$NETWORK_CONFIGURATION" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' \
            --output text)"
          test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`worker`].exitCode | [0]' \
            --output text)"
          test "$EXIT_CODE" = "0"

  deploy_ecs:
    needs: [settings, render_task_definitions, migrate_database]
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-deploy', needs.settings.outputs.environment) }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote task definition revisions
        env:
          RESOURCE_NAME: ${{ needs.render_task_definitions.outputs.resource_name }}
          API_TASK_DEFINITION: ${{ needs.render_task_definitions.outputs.api_task_definition }}
          WORKER_TASK_DEFINITION: ${{ needs.render_task_definitions.outputs.worker_task_definition }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$RESOURCE_NAME" \
            --service "$RESOURCE_NAME-api" \
            --task-definition "$API_TASK_DEFINITION" \
            --force-new-deployment
          aws ecs update-service \
            --cluster "$RESOURCE_NAME" \
            --service "$RESOURCE_NAME-worker" \
            --task-definition "$WORKER_TASK_DEFINITION" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$RESOURCE_NAME" \
            --services "$RESOURCE_NAME-api" "$RESOURCE_NAME-worker"

  # Build and publish in one job, after apply, because the bundle depends on what the apply
  # created. Every target below is read from Terraform state rather than kept as a repository
  # variable: a bucket name, a distribution id and the console's own origin cannot be filled
  # in before the apply that creates them, and once held by hand they go stale silently -- a
  # replaced distribution keeps publishing to the old id, invalidating a cache nobody reads.
  deploy_frontends:
    needs: [settings, quality, terraform_plan, deploy_ecs]
    runs-on: ubuntu-latest
    environment: ${{ format('{0}-deploy', needs.settings.outputs.environment) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read publish targets from state
        id: targets
        working-directory: ${{ needs.terraform_plan.outputs.root }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="region=$AWS_REGION"
          FRONTEND="$(terraform output -json frontend)"
          # One `jq -e` per value: it exits non-zero on null, so a missing output stops here
          # with the name of what was missing instead of an `s3 sync` to "s3://null".
          for KEY in company applicant; do
            for FIELD in bucket distribution_id url; do
              VALUE="$(jq -er --arg k "$KEY" --arg f "$FIELD" '.sites[$k][$f]' <<<"$FRONTEND")"
              echo "${KEY}_${FIELD}=$VALUE" >> "$GITHUB_OUTPUT"
            done
          done
          echo "api_base_url=$(jq -r '.api_base_url' <<<"$FRONTEND")" >> "$GITHUB_OUTPUT"
          # The Cognito trio is allowed to be absent -- a foundation root with no
          # `cognito_domain_prefix` has no hosted login UI yet -- but it is all or nothing.
          # `readCompanyAuthConfig` needs all three and silently falls back to a demo token
          # when any one is missing, so a partial set is refused here rather than shipped.
          LOGIN_DOMAIN="$(jq -r '.cognito.login_domain // ""' <<<"$FRONTEND")"
          CLIENT_ID="$(jq -r '.cognito.client_id // ""' <<<"$FRONTEND")"
          REDIRECT_URI="$(jq -r '.cognito.redirect_uri // ""' <<<"$FRONTEND")"
          PRESENT=0
          for VALUE in "$LOGIN_DOMAIN" "$CLIENT_ID" "$REDIRECT_URI"; do
            test -n "$VALUE" && PRESENT=$((PRESENT + 1))
          done
          if [[ "$PRESENT" -eq 3 ]]; then
            echo "cognito_domain=$LOGIN_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "cognito_client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
            echo "cognito_redirect_uri=$REDIRECT_URI" >> "$GITHUB_OUTPUT"
          elif [[ "$PRESENT" -eq 0 ]]; then
            echo "::warning::No Cognito login domain in state; the console will build without browser login."
          else
            echo "::error::Cognito configuration is incomplete ($PRESENT of 3); the console would build a login that cannot work."
            exit 1
          fi

      - run: npm ci

      - name: Build browser applications against the deployed environment
        env:
          # Empty, and correct: each distribution routes `/v1/*` to the ALB beside its own SPA
          # origin, so the browser reaches the API on the origin it was served from. Both
          # applications already default to that.
          VITE_API_BASE_URL: ${{ steps.targets.outputs.api_base_url }}
          VITE_APPLICANT_APP_URL: ${{ steps.targets.outputs.applicant_url }}/access
          VITE_COGNITO_DOMAIN: ${{ steps.targets.outputs.cognito_domain }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.targets.outputs.cognito_client_id }}
          VITE_COGNITO_REDIRECT_URI: ${{ steps.targets.outputs.cognito_redirect_uri }}
          # Optional public username hint for the pre-created judge account. Its password must
          # remain outside the browser build and be shared with judges through a secure channel.
          VITE_DEMO_COMPANY_EMAIL: ${{ vars.DEMO_COMPANY_EMAIL }}
        run: npm run build

      - name: Publish private SPA origins and invalidate edge caches
        env:
          COMPANY_SPA_BUCKET: ${{ steps.targets.outputs.company_bucket }}
          APPLICANT_SPA_BUCKET: ${{ steps.targets.outputs.applicant_bucket }}
          COMPANY_DISTRIBUTION_ID: ${{ steps.targets.outputs.company_distribution_id }}
          APPLICANT_DISTRIBUTION_ID: ${{ steps.targets.outputs.applicant_distribution_id }}
        run: |
          set -euo pipefail
          # `cp --recursive` before `sync --delete`, because an object carries the encryption
          # it was written with: changing a bucket's server-side encryption leaves every
          # existing object sealed under the old key, and both buckets are full of objects
          # written under the customer key that CloudFront cannot decrypt. `sync` alone would
          # not rewrite them -- it skips a same-sized source that is not newer, and
          # `index.html` keeps its name and roughly its size across builds. (`--exact-
          # timestamps` is not the fix; the CLI applies it only when syncing S3 to local.)
          #
          # `cp` copies unconditionally, so the bytes land under whatever encryption the
          # bucket carries now. The `sync --delete` after it is then only doing what `cp`
          # cannot: pruning the previous build's hashed asset files, which would otherwise
          # accumulate forever. Nothing is deleted before it has been replaced.
          aws s3 cp apps/company-console/dist "s3://$COMPANY_SPA_BUCKET" --recursive
          aws s3 sync apps/company-console/dist "s3://$COMPANY_SPA_BUCKET" --delete
          aws s3 cp apps/applicant-interview/dist "s3://$APPLICANT_SPA_BUCKET" --recursive
          aws s3 sync apps/applicant-interview/dist "s3://$APPLICANT_SPA_BUCKET" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$COMPANY_DISTRIBUTION_ID" --paths '/*'
          aws cloudfront create-invalidation \
            --distribution-id "$APPLICANT_DISTRIBUTION_ID" --paths '/*'

      # What the local suite structurally cannot check, run against the thing that was just
      # published. The browser suite stays on the local stack -- nginx, Mailpit and the fake
      # principal provider make a deterministic seed possible there, and make CloudFront, SES
      # and Cognito behaviour unobservable. These checks are the other half, and they assert
      # no application data, so there is nothing to seed and nothing to clean up.
      #
      # After the publish, not before: every check reads the bundle and the edge behaviour
      # that this job's `s3 sync` and invalidation produce.
      - name: Smoke the deployed environment
        env:
          COMPANY_URL: ${{ steps.targets.outputs.company_url }}
          APPLICANT_URL: ${{ steps.targets.outputs.applicant_url }}
        run: |
          set -euo pipefail
          # A distribution serves the previous object until the invalidation it was just
          # handed completes, so a check that ran immediately would grade the last deploy.
          sleep 60
          # `tee` keeps the output on the job log while also collecting it for the summary,
          # and the exit status has to be the script's, not tee's -- hence PIPESTATUS rather
          # than a plain pipeline, which would report success for a failed check.
          set +e
          scripts/smoke_deployed.sh 2>&1 | tee "$RUNNER_TEMP/smoke.txt"
          STATUS="${PIPESTATUS[0]}"
          set -e
          {
            echo "### Deployed smoke"
            echo '```'
            cat "$RUNNER_TEMP/smoke.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      # The URLs to open, printed on the run rather than looked up in the console. Without a
      # domain these are CloudFront hostnames nobody can guess. `always()` so they are
      # reported even when the smoke check above failed -- that is exactly when someone wants
      # to open them by hand.
      - name: Report reachable URLs
        if: always()
        env:
          COMPANY_URL: ${{ steps.targets.outputs.company_url }}
          APPLICANT_URL: ${{ steps.targets.outputs.applicant_url }}
        run: |
          set -euo pipefail
          {
            echo "### Deployed"
            echo "- Company console: $COMPANY_URL"
            echo "- Applicant interview: $APPLICANT_URL/access"
          } >> "$GITHUB_STEP_SUMMARY"
